name: GUI

# The desktop GUI is a standalone Cargo workspace (excluded from the root
# workspace), so it is verified here — path-gated — instead of in the core CI.
on:
  push:
    branches: [main]
    paths: ["sara-gui/**", ".github/workflows/gui.yml"]
  pull_request:
    paths: ["sara-gui/**", ".github/workflows/gui.yml"]

defaults:
  run:
    working-directory: sara-gui

jobs:
  web:
    name: Web (typecheck · build · storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sara-gui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build-storybook

  tauri:
    name: Tauri crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sara-gui/src-tauri

      # git2 uses vendored libgit2, so only a C compiler is needed (present on
      # all runners) — no system libgit2. Verify the crate compiles + clippy.
      - name: Build backend
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Clippy backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
